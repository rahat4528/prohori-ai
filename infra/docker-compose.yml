version: "3.8"

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: prohori-db
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-prohori}
    volumes:
      - prohori_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d prohori"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ../api
      dockerfile: Dockerfile
    container_name: prohori-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://postgres:postgres@db:5432/prohori}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      PORT: 8000
      HOST: 0.0.0.0
    volumes:
      - ../api/app:/app/app

volumes:
  prohori_pgdata:
