# ==============================================================================
# Prohori AI — Render Blueprint Deployment Specification
# Automatically deploys the FastAPI Event API & AI Core on Render Free Tier
# Blueprint ID: exs-dbrh0kec6qcc73dstli0
# ==============================================================================

services:
  # Prohori AI - Main Event Bus & AI SOC Analyst Core
  - type: web
    name: prohori-api
    runtime: python
    plan: free
    healthCheckPath: /healthz
    buildCommand: pip install -r requirements.txt
    startCommand: python -m uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.1
      - key: PYTHONPATH
        value: api:.
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: false
      - key: DATABASE_URL
        value: sqlite+aiosqlite:///prohori.db
      - key: CORS_ORIGINS
        value: '["*"]'
      - key: LLM_PROVIDER
        value: auto
      - key: GEMINI_MODEL
        value: gemini-1.5-flash
      - key: GEMINI_API_KEY
        sync: false

  # Prohori Deception Honeypot (Simulated Decoy Sensor)
  - type: web
    name: prohori-honeypot
    runtime: python
    plan: free
    healthCheckPath: /
    buildCommand: pip install -r requirements.txt
    startCommand: python -m uvicorn sensors.deception.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.1
      - key: PYTHONPATH
        value: api:.
      - key: EVENT_API_URL
        fromService:
          type: web
          name: prohori-api
          property: host
