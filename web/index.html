<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <title>Prohori AI (প্রহরী) — Autonomous AI-Native SOC Console</title>
    <script>
      // Prevent localhost collision: aggressively unregister any legacy service workers & clear caches from past projects
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function(registrations) {
          for (let registration of registrations) {
            registration.unregister();
            console.log('[Prohori AI] Unregistered stale legacy service worker:', registration);
          }
        }).catch(function() {});
      }
      if ('caches' in window) {
        caches.keys().then(function(names) {
          for (let name of names) {
            caches.delete(name);
            console.log('[Prohori AI] Cleared stale cache storage:', name);
          }
        }).catch(function() {});
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
