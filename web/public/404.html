<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#14213D" />
    <meta name="description" content="404 - Page Not Found - Prohori AI Sentinel SOC Console" />
    <title>404 — Page Not Found | Prohori AI</title>
    <style>
      :root {
        --navy: #14213D;
        --cream: #F4EDE0;
        --coral: #FF6258;
      }
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background-color: var(--navy);
        color: var(--cream);
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
      }
      .card {
        max-width: 500px;
        width: 100%;
        border: 1.5px solid rgba(244, 237, 224, 0.25);
        border-radius: 14px;
        padding: 36px 28px;
        text-align: center;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 18px;
      }
      .badge {
        display: inline-flex;
        padding: 4px 12px;
        border-radius: 6px;
        background: rgba(255, 98, 88, 0.2);
        color: var(--coral);
        border: 1px solid rgba(255, 98, 88, 0.5);
        font-family: monospace;
        font-size: 13px;
        font-weight: bold;
      }
      h1 { font-size: 24px; font-weight: 800; }
      p { font-size: 15px; color: rgba(244, 237, 224, 0.75); line-height: 1.6; }
      a.btn {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 12px 24px;
        font-size: 15px;
        font-weight: 800;
        background: var(--coral);
        color: var(--navy);
        text-decoration: none;
        border-radius: 8px;
        min-height: 44px;
        margin-top: 8px;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="badge">HTTP 404 &bull; PAGE NOT FOUND</div>
      <h1>Security Route Not Found</h1>
      <p>The security console route or resource you are looking for does not exist or has been moved.</p>
      <a href="/" class="btn">&larr; Return to SOC Console</a>
    </div>
  </body>
</html>
